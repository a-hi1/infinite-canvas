server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 宿主机映射常为 3011:3000；默认 absolute/port 跳转会带上容器内 :3000，
    # 浏览器刷新后误进同域名 :3000（如 new-api），与本站无关。
    # 相对跳转保留地址栏端口；SPA try_files 主路径不受影响。
    absolute_redirect off;
    port_in_redirect off;

    client_max_body_size 220m;

    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        # $http_host 保留客户端端口（如 :3001/:3011）；$host 会丢端口，导致
        # API_TRUST_PROXY_SAME_ORIGIN 把 publicOrigin 算成 http://IP 而 Origin 是 http://IP:3001，登录 403。
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /ai-proxy/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $ai_proxy_upstream ai-proxy:3002;
        rewrite ^/ai-proxy/(.*)$ /$1 break;
        proxy_pass http://$ai_proxy_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 可选：内网 OpenAI 兼容服务同源中继（绕过浏览器 CORS）。
    # 由 docker-entrypoint 根据 LAN_AI_UPSTREAM 生成；未配置时返回 503 说明。
    include /etc/nginx/conf.d/lan-ai.inc;

    # SPA「我的资产」路由是 /assets；旧版 Vite 构建产物也在 /assets/*.js。
    # 刷新 /assets 或 /assets/ 时 try_files 会命中真实目录 → 403 Forbidden。
    # 精确匹配页面路径回退到 index.html；带哈希的静态文件仍走 location /。
    location = /assets {
        try_files /index.html =404;
    }
    location = /assets/ {
        try_files /index.html =404;
    }

    location / {
        # 不使用 $uri/，避免其它 SPA 路径与空目录撞车时再 403。
        try_files $uri /index.html;
    }
}
