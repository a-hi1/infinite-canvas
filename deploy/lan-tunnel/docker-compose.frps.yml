# 公网服务器：可选 FRP 服务端（与主 compose 文件分离，默认不随主栈启动）。
# 用法见 README.md。
#
# 与主栈 app 共用网络 infinite-canvas_default，便于 /lan-ai 用
#   LAN_AI_UPSTREAM=http://infinite-canvas-frps:18000
# 避免 host.docker.internal → 宿主机端口在部分环境 502。
#
# 不影响 api/ai-proxy 业务。端口：
#   - 公网 7000：frp 控制（安全组放行）
#   - 18000：隧道出口（安全组/ufw 不要放行）

services:
  frps:
    image: snowdreamtech/frps:0.61.1
    container_name: infinite-canvas-frps
    restart: unless-stopped
    ports:
      - "7000:7000"
      # 宿主机也可 curl 本机 18000 做验收；勿在防火墙放行公网 18000
      - "18000:18000"
    volumes:
      - ./frps.toml:/etc/frp/frps.toml:ro
    command: ["-c", "/etc/frp/frps.toml"]
    networks:
      - infinite_canvas

networks:
  infinite_canvas:
    # 与 docker compose -f docker-compose.local.yml 默认项目名 infinite-canvas 一致
    name: infinite-canvas_default
    external: true
