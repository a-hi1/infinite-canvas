services:
  app:
    image: infinite-canvas:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    restart: unless-stopped

  ai-proxy:
    image: infinite-canvas-ai-proxy:local
    build:
      context: ./ai-proxy
      dockerfile: Dockerfile
    env_file:
      - .env.proxy
    expose:
      - "3002"
    restart: unless-stopped
