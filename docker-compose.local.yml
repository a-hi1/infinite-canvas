services:
  app:
    image: infinite-canvas:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    depends_on:
      - api
      - ai-proxy
    restart: unless-stopped

  api:
    image: infinite-canvas-api:local
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      DATA_DIR: /data
      # Compose 从仓库根目录 `.env` 做变量插值（推荐 cp .env.api.example .env 后按需改）。
      # 公网 HTTPS 务必：API_COOKIE_SECURE=true，并收紧 API_ALLOWED_ORIGINS；开放注册设 API_INVITE_CODE。
      # 含 dev-host 3011；公网请在根目录 .env 收紧为实际域名/IP，禁止 *
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3011,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3011}
      # 同源反代默认放行（Origin == X-Forwarded-Host/Host + Proto）；跨站仍靠白名单
      API_TRUST_PROXY_SAME_ORIGIN: ${API_TRUST_PROXY_SAME_ORIGIN:-true}
      API_COOKIE_SECURE: ${API_COOKIE_SECURE:-false}
      API_INVITE_CODE: ${API_INVITE_CODE:-}
      API_MAX_USER_BYTES: ${API_MAX_USER_BYTES:-5368709120}
      API_MAX_IMAGE_BYTES: ${API_MAX_IMAGE_BYTES:-20971520}
      API_MAX_VIDEO_BYTES: ${API_MAX_VIDEO_BYTES:-209715200}
      API_SESSION_TTL_SEC: ${API_SESSION_TTL_SEC:-604800}
      API_REMOTE_FETCH_TIMEOUT_MS: ${API_REMOTE_FETCH_TIMEOUT_MS:-}
      # 本机浏览器代理 ≠ 容器出网。若 vidgen 仅系统/Clash 可访问，在根目录 .env 写：
      # HTTP_PROXY/HTTPS_PROXY=http://host.docker.internal:7890（端口改成你的本地代理端口）
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,api,ai-proxy,app}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1,api,ai-proxy,app}
    volumes:
      - ./data/api:/data
    # 只在 compose 网络内提供 8080；浏览器经 app Nginx 同源 /api/ 访问。
    # 不再默认映射宿主机 8080，避免与服务器其他服务抢端口导致 api 起不来。
    # 本机排查如需直连 API，可临时取消下一行注释：
    # ports:
    #   - "8081:8080"
    expose:
      - "8080"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ai-proxy:
    image: infinite-canvas-ai-proxy:local
    build:
      context: ./ai-proxy
      dockerfile: Dockerfile
    env_file:
      - .env.proxy
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,api,ai-proxy,app}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1,api,ai-proxy,app}
    expose:
      - "3002"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
